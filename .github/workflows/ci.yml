name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Coverage
        run: mvn clean verify -Pdev,coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          retention-days: 7

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check code formatting
        run: mvn com.spotify.fmt:fmt-maven-plugin:check

      - name: Run Error Prone
        run: mvn clean compile -Perrorprone

  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run Pitest
        run: mvn test-compile pitest:mutationCoverage -Pdev,pitest -pl guava-range-parser-core,guava-range-parser-jackson,guava-range-parser-spring -am

      - name: Upload mutation reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pitest-reports
          path: '**/target/pit-reports/'
          retention-days: 7

  spring-compat:
    name: Spring Boot Compat (${{ matrix.spring-boot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported, current 4.0 patch, and current 4.1 patch.
        # 3.5.x is the supported floor -- see "Compatibility" in README.md.
        # Bump these deliberately; raising the floor is a breaking change
        # for consumers and warrants a minor release of this library.
        spring-boot: [ '3.5.16', '4.0.8', '4.1.1' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test against Spring Boot ${{ matrix.spring-boot }}
        run: mvn -B clean test -Dspring-boot.version=${{ matrix.spring-boot }} -pl guava-range-parser-spring -am

  spring-binary-compat:
    name: Spring Boot Binary Compat
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # The matrix above recompiles per version, so it cannot catch a newer
      # API baked into the jar we actually publish. This compiles against the
      # version we build with, then runs that exact bytecode against the
      # oldest supported Boot -- the real NoSuchMethodError guard.
      - name: Compile against the build version
        run: mvn -B clean test-compile -pl guava-range-parser-spring -am

      - name: Run that bytecode against the oldest supported Boot
        run: mvn -B surefire:test -Dspring-boot.version=3.5.16 -pl guava-range-parser-spring

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Check NVD API Key
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY secret is not set. Skipping security scan."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache NVD database
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data/
          key: nvd-db-${{ github.run_id }}
          restore-keys: nvd-db-

      - name: Run OWASP Dependency-Check
        run: mvn verify -Pdev,security -DskipTests "-DnvdApiKey=$NVD_API_KEY"

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-reports
          path: '**/target/dependency-check/'
          retention-days: 7
